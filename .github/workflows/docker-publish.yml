name: Docker Publish

on:
  workflow_call:
    inputs:
      tag:
        description: Git tag to publish, for example v0.1.0 or yapd-v0.1.0.
        required: true
        type: string
    secrets:
      DOCKERHUB_TOKEN:
        required: true
      DOCKERHUB_USERNAME:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish, for example v0.1.0 or yapd-v0.1.0.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  DOCKERHUB_IMAGE: leufrasiojunior/yapd

jobs:
  publish:
    name: Build and push multi-arch image
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME || 'leufrasiojunior' }}
    steps:
      - name: Check Docker Hub token
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Configure the DOCKERHUB_TOKEN repository secret before publishing Docker images."
            exit 1
          fi

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          git_tag="$INPUT_TAG"

          if [[ -z "$git_tag" ]]; then
            echo "::error::A release Git tag is required, for example v0.1.0 or yapd-v0.1.0."
            exit 1
          fi

          if [[ "$git_tag" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            version="${BASH_REMATCH[1]}"
          elif [[ "$git_tag" =~ ^.+-v?([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "::error::Expected a release Git tag like v0.1.0 or yapd-v0.1.0, got '$git_tag'."
            exit 1
          fi

          semver_tag="v$version"
          {
            echo "ref=$git_tag"
            echo "version=$version"
            echo "tags<<TAGS"
            echo "$DOCKERHUB_IMAGE:$semver_tag"
            echo "$DOCKERHUB_IMAGE:$version"

            if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              echo "$DOCKERHUB_IMAGE:$major.$minor"

              if [[ "$major" != "0" ]]; then
                echo "$DOCKERHUB_IMAGE:$major"
              fi

              echo "$DOCKERHUB_IMAGE:latest"
            fi

            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.ref }}

      - name: Resolve release commit
        id: git
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.tags }}
          labels: |
            org.opencontainers.image.title=YAPD
            org.opencontainers.image.description=Yet Another Pi-hole Dashboard
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.git.outputs.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
